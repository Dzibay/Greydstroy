<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница удалена — Грэйдстрой</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Этой страницы больше нет. Она осталась от старого сайта." />
  <link rel="canonical" href="https://greydstroy.ru/" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: Manrope, system-ui, sans-serif;
      background: #11151a;
      color: #f2f4f6;
    }
    .box { max-width: 520px; }
    .code {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ff5a1f;
      margin-bottom: 18px;
    }
    h1 {
      font-family: Unbounded, system-ui, sans-serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p { color: #a7b1bc; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
    a {
      display: inline-flex;
      align-items: center;
      background: #ff5a1f;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      padding: 15px 26px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">410 · страница удалена</p>
    <h1>Этой страницы больше нет</h1>
    <p>Адрес остался от старого сайта. Нужная информация — на новой версии: услуги, объекты и контакты.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
