server {
    listen 80;
    listen [::]:80;
    server_name greydstroy.ru www.greydstroy.ru;

    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx
    server_tokens off;

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Хэшированные ассеты Vite — кэш на год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Картинки и статические документы — кэш на 30 дней
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-fallback: все остальные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health-check для оркестраторов
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
